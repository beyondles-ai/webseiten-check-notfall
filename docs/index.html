<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webseiten-Check</title>
<meta name="description" content="Prüf deine Webseite: Ist alles da, ist sie sauber aufgebaut, findet Google sie, und versteht eine KI wie ChatGPT deine Firma?">
<style>
:root{--bg:#0A0E1A;--card:#161E33;--border:#24304C;--text:#FFFFFF;--muted:#C7CEDD;--accent:#9652E8;--green:#2EBD85;--yellow:#F5B942;--red:#E5484D;--gray:#7B86A0;--field:#0F1526}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 48px}
header{padding:18px 0 6px}
header h1{margin:0;font-size:30px;line-height:1.2;letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--muted)}
footer{margin-top:40px;color:var(--gray);font-size:14px;text-align:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-top:14px}
.card h2{margin:0 0 6px;font-size:20px;line-height:1.25}
.card h3{margin:0;font-size:18px;line-height:1.3}
.muted{color:var(--muted)}
.small{font-size:14px}
.lbl{display:block;font-weight:600;margin-bottom:8px}
input[type=text]{width:100%;height:54px;padding:0 14px;font-size:18px;color:var(--text);background:var(--field);border:1px solid var(--border);border-radius:12px;outline:none}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(150,82,232,.35)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.seg label{position:relative;display:block}
.seg input{position:absolute;opacity:0;width:0;height:0}
.seg span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:50px;padding:8px 10px;border:1px solid var(--border);border-radius:12px;background:var(--field);color:var(--muted);font-size:15px;line-height:1.3;cursor:pointer}
.seg input:checked+span{border-color:var(--accent);color:var(--text);background:rgba(150,82,232,.18);font-weight:600}
.seg input:focus-visible+span{box-shadow:0 0 0 3px rgba(150,82,232,.35)}
button.primary{width:100%;height:54px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:19px;font-weight:700;cursor:pointer}
button.primary:disabled{opacity:.6;cursor:default}
button.primary:focus-visible{outline:3px solid #fff;outline-offset:2px}
.chip{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:999px;border:1px solid var(--accent);color:var(--text);background:rgba(150,82,232,.15);font-size:16px;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:58px;height:36px;padding:0 12px;border-radius:999px;font-weight:800;font-size:18px;color:#0A0E1A;flex:none}
.badge.green{background:var(--green)}.badge.yellow{background:var(--yellow)}.badge.red{background:var(--red)}.badge.gray{background:var(--gray);color:#fff}
.badge.sm{height:30px;min-width:48px;font-size:15px}
.overall{text-align:center;padding:24px 18px}
.overall .num{font-size:64px;font-weight:800;line-height:1}
.overall .word{margin-top:6px;font-weight:600}
.overall .num.green{color:var(--green)}.overall .num.yellow{color:var(--yellow)}.overall .num.red{color:var(--red)}
.geo{border-color:var(--accent);padding:22px 18px}
.geo h2{font-size:24px}
.geo .badge{height:42px;min-width:66px;font-size:21px}
.list{list-style:none;margin:12px 0 0;padding:0}
.list li{position:relative;padding:6px 0 6px 30px;border-top:1px solid rgba(36,48,76,.6)}
.list li:first-child{border-top:0}
.list li::before{content:"";position:absolute;left:4px;top:14px;width:14px;height:14px;border-radius:50%}
.list li.ok::before{background:var(--green);content:"✓";color:#0A0E1A;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;width:16px;height:16px;left:3px}
.list li.warn::before{background:var(--yellow)}
.list li.bad::before{background:var(--red)}
.list li.plain{padding-left:0}
.list li.plain::before{display:none}
details.more{margin-top:8px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:600;list-style:none;padding:6px 0}
details.more summary::-webkit-details-marker{display:none}
.sub{margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.25);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:30px 18px}
.loading .spinner{width:36px;height:36px;border-width:4px;margin:0 0 12px}
.error{border-color:var(--red)}
.pagecard.off{opacity:.75}
.url{word-break:break-all;color:var(--muted);font-size:14px}
.ai{margin-top:14px;padding:14px;border-radius:12px;background:var(--field);border:1px solid var(--border)}
.ai h4{margin:0 0 6px;font-size:16px}
.headlist li{color:var(--muted)}
.headlist li b{color:var(--text);font-weight:600;margin-right:6px;font-size:13px;background:var(--border);padding:1px 6px;border-radius:6px}
.hint{margin-top:10px;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Webseiten-Check</h1>
    <p>Gib eine Webadresse ein und sieh, wie gut die Seite dasteht.</p>
  </header>

  <form id="form" class="card" novalidate>
    <label class="lbl" for="url">Webadresse</label>
    <input id="url" type="text" inputmode="url" autocomplete="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="z. B. deine-firma.de">
    <div class="seg" role="radiogroup" aria-label="Umfang der Prüfung">
      <label><input type="radio" name="pages" value="0"><span>Nur Startseite</span></label>
      <label><input type="radio" name="pages" value="5" checked><span>Startseite + 5 Unterseiten</span></label>
    </div>
    <button id="go" class="primary" type="submit">Prüfen</button>
  </form>

  <section id="out" aria-live="polite"></section>

  <footer>Gebaut live beim 4. HÄRTING KI-Tag, 19.11.2026</footer>
</div>

<script>
const HELPER_URL = "https://check.beyondles.ai";

const TIMEOUT_MS = 45000;
const OFFLINE_MSG = "Der Prüfdienst ist gerade nicht erreichbar. Bitte gleich noch einmal versuchen.";
const REASON_MSG = {
  "gesperrt": "Diese Webseite lässt keine automatische Prüfung zu. Das machen manche Seiten mit Schutzdiensten. Probier eine andere Adresse.",
  "zeitüberschreitung": "Die Webseite hat zu lange gebraucht.",
  "nicht erreichbar": "Diese Webseite ist nicht erreichbar. Stimmt die Adresse?",
  "ungültige adresse": "Das ist keine gültige öffentliche Webadresse."
};
const AI_BOTS = ["GPTBot", "ClaudeBot", "PerplexityBot", "Google-Extended"];
const BOT_NAMES = { "GPTBot": "ChatGPT", "ClaudeBot": "Claude", "PerplexityBot": "Perplexity", "Google-Extended": "Google Gemini" };

const $ = (s) => document.querySelector(s);
const out = $("#out");
const form = $("#form");
const urlInput = $("#url");
const goBtn = $("#go");

class AppError extends Error {}

// ---------- helpers ----------
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function clamp(n) { return Math.max(0, Math.min(100, Math.round(n))); }
function color(score) { return score >= 80 ? "green" : score >= 50 ? "yellow" : "red"; }
function word(score) { return score >= 80 ? "Gut aufgestellt" : score >= 50 ? "Ausbaufähig" : "Viel Luft nach oben"; }
function short(s, n = 70) { s = String(s || "").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function badge(score, sm) { return `<span class="badge ${color(score)} ${sm ? "sm" : ""}">${score}</span>`; }
function pathOf(u) { try { const x = new URL(u); return (x.host + x.pathname).replace(/\/$/, ""); } catch (e) { return u; } }

function listHtml(items, render, cls = "", limit = 6) {
  if (!items.length) return "";
  const vis = items.slice(0, limit).map(render).join("");
  if (items.length <= limit) return `<ul class="list ${cls}">${vis}</ul>`;
  const rest = items.slice(limit).map(render).join("");
  return `<ul class="list ${cls}">${vis}</ul><details class="more"><summary>${items.length - limit} weitere anzeigen</summary><ul class="list ${cls}">${rest}</ul></details>`;
}
const renderFinding = (f) => `<li class="${f.status}">${esc(f.text)}</li>`;

// ---------- scoring ----------
// Every scorer collects {pts, max, findings} through add(got, max, status, text).
function scorer() {
  const s = { pts: 0, max: 0, findings: [] };
  s.add = (got, max, status, text) => { s.pts += got; s.max += max; s.findings.push({ status, text }); };
  s.result = () => ({ score: s.max ? clamp(s.pts / s.max * 100) : 0, findings: s.findings });
  return s;
}

function altShare(d) {
  const img = d.images || { total: 0, withoutAlt: 0 };
  if (!img.total) return 1;
  return (img.total - img.withoutAlt) / img.total;
}

function scoreCompleteness(d) {
  const s = scorer();
  const h1n = (d.h1 || []).length;
  if (d.title) s.add(15, 15, "ok", `Die Seite hat einen Titel: „${short(d.title)}“.`);
  else s.add(0, 15, "bad", "Die Seite hat keinen Titel. Gib ihr einen Titel mit Firmenname und Angebot, zum Beispiel „Müller Elektro, Elektriker in Falkensee“.");
  if (d.metaDescription) s.add(15, 15, "ok", "Die Seite hat eine Beschreibung für Suchergebnisse.");
  else s.add(0, 15, "bad", "Die Seite hat keine Beschreibung für Suchergebnisse. Schreib zwei Sätze, was ihr anbietet und für wen.");
  if (h1n === 1) s.add(15, 15, "ok", `Die Seite hat genau eine Hauptüberschrift: „${short(d.h1[0])}“.`);
  else if (h1n === 0) s.add(0, 15, "bad", "Die Seite hat keine Hauptüberschrift. Schreib ganz oben eine Überschrift, die in einem Satz sagt, was ihr macht.");
  else s.add(5, 15, "warn", `Die Seite hat ${h1n} Hauptüberschriften. Lass nur eine stehen und mach die anderen zu Zwischenüberschriften.`);
  if (d.lang) s.add(10, 10, "ok", `Die Sprache der Seite ist angegeben (${d.lang}).`);
  else s.add(0, 10, "warn", "Die Sprache der Seite ist nicht angegeben. Lass deinen Webbauer die Sprache im Seitenkopf eintragen, dann lesen Vorlesefunktionen und Suchmaschinen sie richtig.");
  if (d.canonical) s.add(10, 10, "ok", "Die Seite nennt ihre Hauptadresse (Canonical), so gibt es keine Doppelgänger.");
  else s.add(0, 10, "warn", "Die Seite nennt keine Hauptadresse (Canonical). Lass sie eintragen, damit Google nicht mehrere Versionen derselben Seite sieht.");
  if (d.viewport) s.add(10, 10, "ok", "Die Seite ist für Handys eingerichtet.");
  else s.add(0, 10, "bad", "Die Seite ist nicht für Handys eingerichtet. Lass die Handy-Einstellung (Viewport) im Seitenkopf ergänzen.");
  const img = d.images || { total: 0, withoutAlt: 0 };
  const share = altShare(d);
  if (!img.total) s.add(15, 15, "ok", "Die Seite hat keine Bilder, also fehlt auch kein Alternativtext.");
  else if (img.withoutAlt === 0) s.add(15, 15, "ok", `Alle ${img.total} Bilder haben einen Alternativtext.`);
  else s.add(Math.round(15 * share), 15, share >= .7 ? "warn" : "bad", `${img.withoutAlt} von ${img.total} Bildern haben keinen Alternativtext. Beschreib jedes Bild in ein paar Worten, dann verstehen auch KI und Blinde, was darauf ist.`);
  if ((d.wordCount || 0) >= 300) s.add(10, 10, "ok", `Die Seite hat genug Text (${d.wordCount} Wörter).`);
  else s.add(Math.round(10 * Math.min(1, (d.wordCount || 0) / 300)), 10, (d.wordCount || 0) >= 150 ? "warn" : "bad", `Die Seite hat nur ${d.wordCount || 0} Wörter Text. Schreib mindestens 300 Wörter darüber, was ihr anbietet und für wen.`);
  return s.result();
}

function scoreStructure(d) {
  const s = scorer();
  const h1n = (d.h1 || []).length, h2n = (d.h2 || []).length, h3n = (d.h3 || []).length;
  if (h1n + h2n + h3n > 0) s.add(20, 20, "ok", `Die Seite ist mit Überschriften gegliedert (${h1n + h2n + h3n} Stück).`);
  else s.add(0, 20, "bad", "Die Seite hat keine Überschriften. Teil den Text in Abschnitte mit klaren Überschriften auf.");
  if (h1n === 1) s.add(20, 20, "ok", "Es gibt genau eine Hauptüberschrift, so soll es sein.");
  else if (h1n === 0) s.add(0, 20, "bad", "Es fehlt die Hauptüberschrift. Jede Seite braucht genau eine.");
  else s.add(7, 20, "warn", `Es gibt ${h1n} Hauptüberschriften. Behalte eine und stuf die anderen herab.`);
  if (h3n > 0 && h2n === 0) s.add(0, 15, "warn", "Die Seite nutzt kleine Zwischenüberschriften, aber keine mittleren. Halte die Reihenfolge ein: erst groß, dann mittel, dann klein.");
  else s.add(15, 15, "ok", "Die Überschriften-Ebenen sind in der richtigen Reihenfolge.");
  const wc = d.wordCount || 0;
  if (wc >= 300) s.add(15, 15, "ok", "Die Textmenge reicht für eine aussagekräftige Seite.");
  else if (wc >= 150) s.add(8, 15, "warn", `Mit ${wc} Wörtern ist die Seite recht knapp. Ergänze ein paar Absätze zu Angebot und Zielgruppe.`);
  else s.add(0, 15, "bad", `Mit ${wc} Wörtern ist die Seite fast leer. Schreib auf, was ihr macht, für wen und warum man euch wählen sollte.`);
  const img = d.images || { total: 0, withoutAlt: 0 };
  const share = altShare(d);
  if (!img.total || img.withoutAlt === 0) s.add(15, 15, "ok", "Alle Bilder sind beschrieben.");
  else s.add(Math.round(15 * share), 15, share >= .7 ? "warn" : "bad", `${Math.round((1 - share) * 100)} % der Bilder haben keine Beschreibung. Trag für jedes Bild einen Alternativtext ein.`);
  if (d.viewport) s.add(15, 15, "ok", "Die Seite passt sich an Handy-Bildschirme an.");
  else s.add(0, 15, "bad", "Die Seite passt sich nicht an Handys an. Lass die Handy-Einstellung (Viewport) ergänzen.");
  return s.result();
}

function scoreSeo(d) {
  const s = scorer();
  const tl = (d.title || "").length, dl = (d.metaDescription || "").length;
  if (tl >= 30 && tl <= 60) s.add(15, 15, "ok", `Der Titel hat eine gute Länge (${tl} Zeichen).`);
  else if (tl > 0) s.add(7, 15, "warn", `Der Titel hat ${tl} Zeichen. Google zeigt 30 bis 60 Zeichen gut an, pass ihn an.`);
  else s.add(0, 15, "bad", "Es fehlt der Titel. Schreib einen mit 30 bis 60 Zeichen, der Firma und Angebot nennt.");
  if (dl >= 70 && dl <= 160) s.add(15, 15, "ok", `Die Beschreibung für Suchergebnisse hat eine gute Länge (${dl} Zeichen).`);
  else if (dl > 0) s.add(7, 15, "warn", `Die Beschreibung für Suchergebnisse hat ${dl} Zeichen. Google zeigt 70 bis 160 Zeichen an, pass sie an.`);
  else s.add(0, 15, "bad", "Es fehlt die Beschreibung für Suchergebnisse. Schreib zwei Sätze mit 70 bis 160 Zeichen, was ihr anbietet und für wen.");
  if ((d.h1 || []).length > 0) s.add(10, 10, "ok", "Die Hauptüberschrift ist da, Google nutzt sie als Hinweis, worum es geht.");
  else s.add(0, 10, "bad", "Die Hauptüberschrift fehlt. Schreib eine mit dem wichtigsten Begriff, unter dem man euch suchen würde.");
  if (d.canonical) s.add(10, 10, "ok", "Die Hauptadresse (Canonical) ist gesetzt.");
  else s.add(0, 10, "warn", "Die Hauptadresse (Canonical) fehlt. Lass sie eintragen, damit Google nur eine Version zählt.");
  const noindex = /noindex/i.test(d.robotsMeta || "");
  if (!noindex) s.add(10, 10, "ok", "Die Seite erlaubt Google, sie in die Suche aufzunehmen.");
  else s.add(0, 10, "bad", "Die Seite verbietet Google, sie in die Suche aufzunehmen (noindex). Entfern diese Sperre, sonst findet dich niemand.");
  if (d.sitemap && d.sitemap.found) s.add(10, 10, "ok", "Eine Sitemap (Inhaltsverzeichnis für Suchmaschinen) ist vorhanden.");
  else s.add(0, 10, "warn", "Es gibt keine Sitemap. Lass eine unter /sitemap.xml anlegen, damit Google alle Seiten findet.");
  if (d.https) s.add(10, 10, "ok", "Die Seite ist verschlüsselt (https).");
  else s.add(0, 10, "bad", "Die Seite ist nicht verschlüsselt. Richte ein Sicherheitszertifikat (https) ein, sonst warnt der Browser.");
  const og = d.openGraph || {};
  if (og.title) s.add(10, 10, "ok", "Beim Teilen in sozialen Netzwerken wird ein Titel angezeigt.");
  else s.add(0, 10, "warn", "Beim Teilen in sozialen Netzwerken fehlt der Titel. Lass einen Open-Graph-Titel eintragen.");
  if (og.image) s.add(10, 10, "ok", "Beim Teilen in sozialen Netzwerken wird ein Vorschaubild angezeigt.");
  else s.add(0, 10, "warn", "Beim Teilen in sozialen Netzwerken fehlt das Vorschaubild. Lass ein Open-Graph-Bild hinterlegen.");
  return s.result();
}

function scoreGeoRules(d) {
  const s = scorer();
  const crawlers = (d.robotsTxt && d.robotsTxt.aiCrawlers) || {};
  const blocked = AI_BOTS.filter((b) => crawlers[b] === "blocked");
  const open = AI_BOTS.length - blocked.length;
  if (!blocked.length) s.add(40, 40, "ok", "Deine Seite sperrt keine KI-Dienste aus, ChatGPT, Claude, Perplexity und Google Gemini dürfen sie lesen.");
  else s.add(10 * open, 40, "bad", `Deine Seite sperrt ${blocked.map((b) => BOT_NAMES[b]).join(", ")} aus. Erlaube diese Dienste in der robots.txt, sonst kann die KI dich nicht kennen und nicht empfehlen.`);
  if (d.llmsTxt && d.llmsTxt.found) s.add(15, 15, "ok", "Es gibt eine llms.txt, eine kurze Textdatei speziell für KI-Dienste.");
  else s.add(0, 15, "warn", "Es gibt keine llms.txt. Leg unter /llms.txt eine kurze Textdatei an, die in wenigen Sätzen sagt, wer ihr seid, was ihr anbietet und für wen.");
  const types = d.jsonLdTypes || [];
  const hasOrg = types.some((t) => /Organization|LocalBusiness/i.test(t));
  if (types.length && hasOrg) s.add(25, 25, "ok", `Die Seite hat maschinenlesbare Angaben zur Firma (${types.slice(0, 4).join(", ")}).`);
  else if (types.length) s.add(15, 25, "warn", `Die Seite hat maschinenlesbare Angaben (${types.slice(0, 4).join(", ")}), aber keine zur Firma selbst. Ergänze Angaben vom Typ Organization mit Name, Adresse und Angebot.`);
  else s.add(0, 25, "bad", "Die Seite hat keine maschinenlesbaren Angaben zur Firma. Lass strukturierte Daten vom Typ Organization einbauen: Name, Ort, Angebot, Kontakt.");
  const dl = (d.metaDescription || "").length;
  if (dl >= 70) s.add(20, 20, "ok", "Die Beschreibung ist lang genug, dass eine KI daraus versteht, worum es geht.");
  else if (dl > 0) s.add(10, 20, "warn", "Die Beschreibung ist sehr kurz. Schreib in zwei Sätzen, wer ihr seid, was ihr anbietet und für wen.");
  else s.add(0, 20, "bad", "Ohne Beschreibung muss die KI raten, was ihr macht. Schreib zwei klare Sätze: wer, was, für wen.");
  return s.result();
}

function scorePage(p) {
  const s = scorer();
  const h1n = (p.h1 || []).length;
  if (p.title) s.add(20, 20, "ok", `Titel: „${short(p.title, 60)}“.`);
  else s.add(0, 20, "bad", "Kein Titel. Gib der Seite einen Titel, der sagt, worum es hier geht.");
  if (p.metaDescription) s.add(20, 20, "ok", "Beschreibung für Suchergebnisse ist da.");
  else s.add(0, 20, "bad", "Keine Beschreibung für Suchergebnisse. Schreib zwei Sätze zum Inhalt dieser Seite.");
  if (h1n === 1) s.add(20, 20, "ok", `Hauptüberschrift: „${short(p.h1[0], 60)}“.`);
  else if (h1n === 0) s.add(0, 20, "bad", "Keine Hauptüberschrift. Schreib eine, die den Inhalt der Seite auf den Punkt bringt.");
  else s.add(7, 20, "warn", `${h1n} Hauptüberschriften. Behalte nur eine.`);
  const wc = p.wordCount || 0;
  if (wc >= 300) s.add(20, 20, "ok", `Genug Text (${wc} Wörter).`);
  else s.add(Math.round(20 * Math.min(1, wc / 300)), 20, wc >= 150 ? "warn" : "bad", `Nur ${wc} Wörter Text. Schreib mindestens 300 Wörter zu dem, worum es auf dieser Seite geht.`);
  const img = p.images || { total: 0, withoutAlt: 0 };
  const share = altShare(p);
  if (!img.total) s.add(20, 20, "ok", "Keine Bilder, also fehlt auch kein Alternativtext.");
  else if (img.withoutAlt === 0) s.add(20, 20, "ok", `Alle ${img.total} Bilder haben einen Alternativtext.`);
  else s.add(Math.round(20 * share), 20, share >= .7 ? "warn" : "bad", `${img.withoutAlt} von ${img.total} Bildern ohne Alternativtext. Beschreib jedes Bild in ein paar Worten.`);
  return s.result();
}

function overall(st) {
  return clamp((st.geo * 2 + st.comp.score + st.struct.score + st.seo.score) / 5);
}

// ---------- AI assessment ----------
function buildPrompt(d) {
  return [
    "Du bewertest, wie gut ein KI-Assistent wie ChatGPT eine Firma anhand ihrer Webseite versteht.",
    "",
    "Titel: " + (d.title || "(keiner)"),
    "Beschreibung: " + (d.metaDescription || "(keine)"),
    "H1: " + ((d.h1 || []).join(" | ") || "(keine)"),
    "H2: " + ((d.h2 || []).slice(0, 10).join(" | ") || "(keine)"),
    "Textauszug: " + (d.textExcerpt || "(kein Text)").slice(0, 2500),
    "",
    "Frage: Wie gut versteht ein KI-Assistent aus diesem Text, wer die Firma ist, was sie anbietet und für wen? Würde er sie empfehlen, wenn jemand nach so einem Anbieter fragt?",
    "Antworte nur mit JSON, ohne Erklärung, auf Deutsch: {\"score\": 0-100, \"summary\": \"ein Satz\", \"missing\": [\"was fehlt, damit die KI die Firma besser versteht\", \"...\"]}",
    "Halte dich kurz: summary höchstens 25 Wörter, missing höchstens 3 Punkte mit je höchstens 15 Wörtern."
  ].join("\n");
}

function parseAi(text) {
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a < 0 || b <= a) return null;
  try {
    const j = JSON.parse(text.slice(a, b + 1));
    const score = Number(j.score);
    if (!isFinite(score)) return null;
    return { score: clamp(score), summary: String(j.summary || ""), missing: Array.isArray(j.missing) ? j.missing.map(String).filter(Boolean) : [] };
  } catch (e) { return null; }
}

async function askAi(d) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    const res = await fetch(HELPER_URL + "/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: buildPrompt(d), maxTokens: 1500 }), signal: ctrl.signal
    });
    const data = await res.json();
    if (!data || !data.ok || !data.text) return null;
    return parseAi(data.text);
  } catch (e) { return null; } finally { clearTimeout(t); }
}

// ---------- fetching ----------
async function fetchSite(url, pages) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    const res = await fetch(`${HELPER_URL}/fetch?url=${encodeURIComponent(url)}&pages=${pages}`, { signal: ctrl.signal });
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (res.status === 429) throw new AppError((data && data.reason) || "Gerade sind zu viele Prüfungen gleichzeitig unterwegs. Bitte gleich noch einmal versuchen.");
    if (!data) throw new AppError(OFFLINE_MSG);
    return data;
  } catch (e) {
    if (e instanceof AppError) throw e;
    if (e && e.name === "AbortError") throw new AppError("Die Prüfung hat zu lange gedauert. Bitte noch einmal versuchen, vielleicht nur mit der Startseite.");
    throw new AppError(OFFLINE_MSG);
  } finally { clearTimeout(t); }
}

// ---------- rendering ----------
function renderEmpty() {
  out.innerHTML = `<div class="card">
    <p style="margin:0">Diese Seite holt eine Webseite samt Unterseiten und prüft, ob alles da ist, ob sie sauber aufgebaut ist, ob Google sie findet und ob eine KI wie ChatGPT die Firma versteht.</p>
    <p class="muted" style="margin:10px 0 0">Zum Ausprobieren antippen:</p>
    <button type="button" class="chip" id="example">beyondles.ai</button>
  </div>`;
  $("#example").addEventListener("click", () => { urlInput.value = "beyondles.ai"; form.requestSubmit(); });
}

function renderLoading(withSub) {
  out.innerHTML = `<div class="card loading"><div class="spinner"></div><div style="font-weight:600">Seite wird geholt …</div>
    ${withSub ? '<div class="muted small" style="margin-top:6px">Mit Unterseiten dauert es bis zu 20 Sekunden, das ist normal.</div>' : ""}</div>`;
}

function renderError(msg) {
  out.innerHTML = `<div class="card error"><h2>Das hat nicht geklappt</h2><p style="margin:0">${esc(msg)}</p></div>`;
}

function areaCard(id, title, res, extra = "", cls = "") {
  return `<section class="card ${cls}" id="${id}">
    <div class="row"><h2>${title}</h2>${badge(res.score)}</div>
    ${listHtml(res.findings, renderFinding)}
    ${extra}
  </section>`;
}

function headingsHtml(d) {
  const items = [...(d.h1 || []).map((t) => ({ l: "H1", t })), ...(d.h2 || []).map((t) => ({ l: "H2", t }))];
  if (!items.length) return "";
  return `<div class="sub"><div class="small muted" style="font-weight:600">Überschriften der Seite</div>
    ${listHtml(items, (h) => `<li class="plain"><b>${h.l}</b>${esc(short(h.t, 90))}</li>`, "headlist")}</div>`;
}

function pageCard(p, label, isHome) {
  if (!p.ok) {
    return `<section class="card pagecard off"><div class="row"><div><h3>${esc(label)}</h3><div class="url">${esc(pathOf(p.url))}</div></div><span class="badge gray sm">Nicht geprüft</span></div>
      <p class="muted small" style="margin:10px 0 0">${esc(REASON_MSG[p.reason] || p.reason || "Die Seite konnte nicht geladen werden.")}</p></section>`;
  }
  const r = scorePage(p);
  return `<section class="card pagecard"><div class="row"><div><h3>${esc(label)}</h3><div class="url">${esc(pathOf(p.finalUrl || p.url))}</div></div>${badge(r.score, true)}</div>
    ${listHtml(r.findings, renderFinding)}
    ${isHome ? headingsHtml(p) : ""}</section>`;
}

function aiBlock(st) {
  if (st.aiPending) return `<div class="ai"><h4>KI-Bewertung</h4><div class="muted"><span class="spinner"></span>Die KI liest den Text gerade …</div></div>`;
  if (!st.ai) return `<div class="ai"><h4>KI-Bewertung</h4><div class="muted">KI-Bewertung gerade nicht verfügbar. Die Punkte oben kommen nur aus den festen Regeln.</div></div>`;
  const a = st.ai;
  return `<div class="ai"><div class="row"><h4>KI-Bewertung: So versteht dich eine KI</h4>${badge(a.score, true)}</div>
    <p style="margin:6px 0 0">${esc(a.summary)}</p>
    ${a.missing.length ? `<div class="small muted" style="margin-top:10px;font-weight:600">Das fehlt der KI</div>${listHtml(a.missing, (m) => `<li class="warn">${esc(m)}</li>`)}` : ""}</div>`;
}

function renderResult(st) {
  const d = st.data;
  const total = overall(st);
  const hint = st.aiPending ? '<div class="hint">Regelteil fertig. Die KI-Bewertung kommt gleich dazu und zählt zur Hälfte.</div>' : "";
  out.innerHTML = `
    <section class="card overall" id="overall">
      <div class="url">${esc(d.finalUrl || d.url)}</div>
      <div class="num ${color(total)}" id="overall-num">${total}</div>
      <div class="word" id="overall-word">${word(total)} · Gesamtnote von 100</div>
      ${d.cached ? '<div class="muted small" style="margin-top:6px">Ergebnis aus dem Zwischenspeicher der letzten Minuten.</div>' : ""}
    </section>
    ${areaCard("geo", "KI-Auffindbarkeit (GEO)", { score: st.geo, findings: st.geoRules.findings }, hint + aiBlock(st), "geo")}
    ${areaCard("comp", "Vollständigkeit", st.comp)}
    ${areaCard("struct", "Aussehen &amp; Aufbau", st.struct)}
    ${areaCard("seo", "Suchmaschinen (SEO)", st.seo)}
    ${pageCard(d, "Startseite", true)}
    ${(d.subpages || []).map((p, i) => pageCard(p, "Unterseite " + (i + 1), false)).join("")}
  `;
}

// ---------- flow ----------
let running = false;
async function run(url, pages) {
  if (running) return;
  running = true;
  goBtn.disabled = true;
  renderLoading(pages > 0);
  try {
    const data = await fetchSite(url, pages);
    if (!data.ok) throw new AppError(REASON_MSG[data.reason] || data.reason || OFFLINE_MSG);
    try { localStorage.setItem("wc:lastUrl", url); localStorage.setItem("wc:pages", String(pages)); } catch (e) {}
    const st = { data, comp: scoreCompleteness(data), struct: scoreStructure(data), seo: scoreSeo(data), geoRules: scoreGeoRules(data), ai: null, aiPending: true };
    st.geo = st.geoRules.score;
    renderResult(st);
    window.scrollTo({ top: Math.max(0, out.offsetTop - 8), behavior: "smooth" });
    const ai = await askAi(data);
    st.aiPending = false;
    st.ai = ai;
    st.geo = ai ? clamp((st.geoRules.score + ai.score) / 2) : st.geoRules.score;
    // Update only the parts that change so the user keeps their scroll position.
    const total = overall(st);
    const num = $("#overall-num");
    if (num) { num.textContent = total; num.className = "num " + color(total); }
    const w = $("#overall-word");
    if (w) w.textContent = word(total) + " · Gesamtnote von 100";
    const geoCard = $("#geo");
    if (geoCard) geoCard.outerHTML = areaCard("geo", "KI-Auffindbarkeit (GEO)", { score: st.geo, findings: st.geoRules.findings }, aiBlock(st), "geo");
  } catch (e) {
    renderError(e instanceof AppError ? e.message : OFFLINE_MSG);
  } finally {
    running = false;
    goBtn.disabled = false;
  }
}

form.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const url = urlInput.value.trim();
  if (!url) { urlInput.focus(); return; }
  const pages = Number((form.querySelector("input[name=pages]:checked") || {}).value || 5);
  run(url, pages);
});

(function init() {
  try {
    const last = localStorage.getItem("wc:lastUrl");
    const pages = localStorage.getItem("wc:pages");
    if (last) urlInput.value = last;
    if (pages === "0" || pages === "5") form.querySelector(`input[name=pages][value="${pages}"]`).checked = true;
  } catch (e) {}
  renderEmpty();
})();
</script>
</body>
</html>
